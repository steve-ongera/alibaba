<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Alibaba Kenya – Best Online Shopping in Kenya</title>
    <meta name="description" content="Shop millions of products online in Kenya. Best prices on electronics, fashion, home appliances & more. Fast delivery across all 47 counties. Pay via M-Pesa." />
    <meta name="keywords" content="online shopping Kenya, buy online Kenya, electronics Kenya, fashion Kenya, Jumia alternative, Mpesa shopping" />
    <meta name="author" content="Alibaba Kenya" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.alibabakenya.co.ke/" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://www.alibabakenya.co.ke/" />
    <meta property="og:title"       content="Alibaba Kenya – Best Online Shopping in Kenya" />
    <meta property="og:description" content="Shop millions of products. Best prices guaranteed. Pay via M-Pesa." />
    <meta property="og:image"       content="https://www.alibabakenya.co.ke/og-image.jpg" />
    <meta property="og:locale"      content="en_KE" />
    <meta property="og:site_name"   content="Alibaba Kenya" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@alibabakenya" />
    <meta name="twitter:title"       content="Alibaba Kenya – Best Online Shopping in Kenya" />
    <meta name="twitter:description" content="Shop millions of products. Pay via M-Pesa." />
    <meta name="twitter:image"       content="https://www.alibabakenya.co.ke/og-image.jpg" />

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Alibaba Kenya",
      "url": "https://www.alibabakenya.co.ke",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.alibabakenya.co.ke/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link rel="apple-touch-icon"                  href="/apple-touch-icon.png" />
